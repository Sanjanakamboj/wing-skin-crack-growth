[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crackgrowth"
version = "1.0.0"
description = "Verified linear-elastic fracture mechanics and Paris-law fatigue crack growth for an idealized aircraft wing-skin crack"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]
# Only needed to regenerate the portfolio figures. The package itself and the
# full test suite have NO runtime dependencies.
figures = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
